<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Eye Inspector</title>
		<link rel="stylesheet" href="index.css" />
	</head>

	<body>
		<div class="layout-outer">
			<div class="layout-row-1">
				<div id="messages-panel">
					<div class="messages-toolbar">
						<div class="messages-toolbar-label">Display</div>
						<div id="toggle-show-ascii-button" class="messages-toolbar-option">ASCII</div>
						<div id="toggle-tight-spacing-button" class="messages-toolbar-option">Tight</div>
						<div id="toggle-fullscreen-button" class="messages-toolbar-option">Fullscreen</div>

						<div class="messages-toolbar-label" style="margin-left: 2rem">Highlight</div>
						<div id="toggle-highlight-none-button" class="messages-toolbar-option">None</div>
						<div id="toggle-highlight-values-button" class="messages-toolbar-option">Values</div>
						<div id="toggle-highlight-shared-ct-button" class="messages-toolbar-option">Shared CT</div>
						<div id="toggle-highlight-isomorphs-button" class="messages-toolbar-option">Isomorphs</div>
						<div id="toggle-highlight-shared-pt-button" class="messages-toolbar-option">Shared PT</div>
					</div>

					<div id="messages-panel-content">
						<div id="messages-column-indices"></div>
						<div id="messages-row-indices"></div>
						<div id="messages-list"></div>
					</div>
				</div>
			</div>

			<div class="layout-row-2">
				<div id="config-panel">
					<div id="config-panel-empty">No config available.</div>

					<div id="isomorph-generator" style="display: none">
						<p class="title">Isomorphs</p>
						<div class="content">
							<div class="isomorph-generator-option">
								<div class="label">Max Length</div>
								<input type="text" id="isomorph-generator-input-max-length" value="50" />
							</div>
							<div class="isomorph-generator-option">
								<div class="label">Min Values</div>
								<input type="text" id="isomorph-generator-input-min-values" value="3" />
							</div>
							<div class="isomorph-generator-option">
								<div class="label">Shared Sections</div>
								<input type="checkbox" id="isomorph-generator-input-shared-sections" checked />
							</div>
							<div class="isomorph-generator-option">
								<div class="label">Extend</div>
								<input type="checkbox" id="isomorph-generator-input-extend" />
							</div>
							<div id="isomorph-generator-generate-button">
								<div>Generate</div>
							</div>
						</div>
					</div>
				</div>

				<div id="inspector-panel">
					<div id="inspector-panel-empty">No inspection available.</div>

					<div id="isomorphs-inspector" style="display: none">
						<div id="isomorphs-inspector-selection">
							<div id="isomorphs-inspector-selection-info" class="inspector-info-row"></div>
							<div id="isomorphs-inspector-selection-list"></div>
						</div>
						<div id="isomorphs-inspector-list-info" class="inspector-info-row"></div>
						<div id="isomorphs-inspector-list">
							<div class="empty">No isomorphs...</div>
						</div>
					</div>

					<div id="shared-pt-inspector" style="display: none">
						<div id="shared-pt-inspector-list-info" class="inspector-info-row"></div>
						<div id="shared-pt-inspector-list">
							<div class="empty">No isomorphs...</div>
						</div>
					</div>
				</div>
			</div>
		</div>

		<script src="index.js"></script>
	</body>
</html>
